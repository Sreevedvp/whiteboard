[package]
name = "whiteboard-desktop"
version = "0.1.0"
edition = "2021"

[dependencies]
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.8", features = ["v4", "fast-rng", "serde"] }
smallvec = "1.13"
rusqlite = { version = "0.31", features = ["bundled"] }

[dev-dependencies]
tempfile = "3.10"
